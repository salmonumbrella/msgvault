name: Recurring schedules generated contracts

on:
  push:
    branches: [ci/recurring-schedules-artifacts]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - uses: step-security/setup-bun@v2.1.3
        with:
          bun-version-file: web/package.json
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Generate API contracts
        run: make api-generate web-generate
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: recurring-schedules-contracts
          path: |
            api/openapi.yaml
            pkg/client/openapi.yaml
            pkg/client/generated
            web/src/lib/api/generated
